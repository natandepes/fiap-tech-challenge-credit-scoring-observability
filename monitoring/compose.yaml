name: credit-scoring-monitoring

services:
  pushgateway:
    image: prom/pushgateway:v1.11.0
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=30s
    ports:
      - "9091:9091"
    volumes:
      - pushgateway-data:/data
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - pushgateway
      - node-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/credit-scoring.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pushgateway-data:
  prometheus-data:
  grafana-data:
